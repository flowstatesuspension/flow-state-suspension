<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Must match the app's black headers. iOS paints the standalone status bar
         region from theme-color; a different value shows as a band above the
         header rather than a seamless black. -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black": iOS draws an opaque black status bar and starts the web view
         below it. "black-translucent" put our content underneath, where iOS 26
         blurs it behind a translucent bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="FlowState" />
    <meta name="description" content="Mountain bike suspension servicing tracker" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2" />
    <title>Flow State Suspension</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
